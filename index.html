<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeron Org. Slot Kayıt Sistemi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d; /* Daha koyu arka plan */
            --card-color: #1a1a1a;
            --text-color: #e0e0e0;
            --primary-color: #e53e3e; /* Kırmızı Vurgu */
            --reserved-color: #630000; /* Rezerve Slot Koyu Kırmızı */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 10vh;
            padding: 24px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        .slot-card {
            background-color: var(--card-color);
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a; /* Hafif sınır */
        }
        .slot-card:not(.reserved):hover {
            background-color: #242424;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
        }
        .reserved {
            cursor: not-allowed;
            background-color: var(--reserved-color);
            color: #ffcccc;
            border: 1px solid #8b0000;
        }
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.85);
        }
        .modal-content {
            background-color: var(--card-color);
        }
        /* Loader stili */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Slot Grid'i için daha estetik bir boşluk */
        #slot-grid {
            gap: 16px;
        }
    </style>
</head>
<body>

<div id="app" class="container">
    <!-- Başlık ve Geri Sayım -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-10 p-5 bg-gray-900 rounded-xl shadow-2xl border border-red-800/50">
        <div class="flex items-center space-x-4 mb-4 md:mb-0">
            <span class="text-5xl text-red-600 font-extrabold tracking-tight">O</span>
            <h1 class="text-4xl font-bold tracking-widest text-gray-100 uppercase">ZERON ORG.</h1>
        </div>
        <div class="flex flex-col items-end bg-gray-800 px-5 py-2 rounded-lg border border-red-600/50">
            <span class="text-xs text-gray-400 font-medium uppercase">Slotlar Sıfırlanana Kadar:</span>
            <span id="countdown" class="text-3xl font-extrabold text-white tracking-widest">00:00:00</span>
        </div>
    </header>

    <!-- Bilgi ve Hata Alanı -->
    <div id="messages" class="mb-6 space-y-3">
        <p class="text-sm font-medium text-gray-400 mb-6 px-1">
            Her takım günde sadece 1 SLOT alabilir. Slotlar gece 00:00'da (Türkiye Saati) otomatik olarak sıfırlanır. Kayıt ve iletişim için Instagram adresi zorunludur.
        </p>
        <!-- Hata Mesajları Buraya Eklenecek (Başlangıçta gizli) -->
        <div id="status-message" class="hidden p-4 rounded-xl text-sm font-bold bg-red-900 border border-red-700 text-red-200 shadow-md"></div>
        <!-- Yönetici Modu Durum Bilgisi Buraya Eklenecek -->
        <div id="admin-status" class="hidden p-4 rounded-xl text-sm font-bold bg-green-900 border border-green-700 text-green-200 shadow-md cursor-pointer"></div>
    </div>

    <!-- Slot Alanı -->
    <div id="slot-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
        <!-- Slot Kartları Buraya JS ile Yüklenecek -->
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="text-center mt-12">
        <div class="spinner mx-auto"></div>
        <p class="mt-4 text-gray-400 font-medium">Slot verileri yükleniyor...</p>
    </div>
</div>

<!-- Slot Kayıt Modalı -->
<div id="slot-modal" class="fixed inset-0 z-50 hidden flex justify-center items-center modal-backdrop transition-opacity duration-300">
    <div class="modal-content w-full max-w-md p-6 rounded-xl shadow-2xl transform transition-transform duration-300 scale-95 opacity-0 border border-red-800">
        <div class="flex justify-between items-center mb-5 border-b border-gray-700 pb-3">
            <h2 id="modal-title" class="text-2xl font-bold text-red-500 tracking-wider">SLOT ALINIYOR</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white transition duration-200">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div id="modal-form">
            <input type="hidden" id="selected-slot-id">
            <div class="mb-4">
                <label for="team-name" class="block text-sm font-medium mb-2 text-gray-300">TAKIM İSMİ</label>
                <input type="text" id="team-name" placeholder="örn. byn esports" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-red-600 focus:border-red-600 text-white placeholder-gray-500" required>
            </div>
            <div class="mb-6">
                <label for="instagram-handle" class="block text-sm font-medium mb-2 text-gray-300">INSTAGRAM HESABI (@ işaretli)</label>
                <input type="text" id="instagram-handle" placeholder="örn. @4neaxx" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-red-600 focus:border-red-600 text-white placeholder-gray-500" required>
            </div>
            <button id="reserve-button" onclick="reserveSlot()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-xl shadow-red-900/40 mb-3 uppercase tracking-wider">
                SLOTU REZERVE ET
            </button>
            <button onclick="closeModal()" class="w-full bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold py-3 rounded-lg transition duration-200 uppercase tracking-wider">
                İPTAL
            </button>
        </div>
        <!-- Sonuç/Bilgi Mesajı -->
        <div id="modal-result" class="hidden text-center p-4">
            <p id="modal-result-text" class="text-xl font-extrabold text-white"></p>
            <button onclick="closeModal()" class="mt-6 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 uppercase">
                KAPAT
            </button>
        </div>
    </div>
</div>

<!-- Firebase Modülleri -->
<script type="module">
    // Firebase Modüllerini İçe Aktar
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
        getFirestore, 
        doc, 
        setDoc, 
        getDoc, 
        onSnapshot, 
        collection, 
        Timestamp,
        setLogLevel,
        deleteDoc, // Yeni: Slot silme için
        getDocs, // Yeni: Toplu silme için
        query
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Hata ayıklama loglarını açın
    setLogLevel('debug'); 

    // Genel Değişkenler
    let db;
    let auth;
    let userId = null;
    let isAuthReady = false;
    const TOTAL_SLOTS = 25;
    let RESERVED_SLOTS = {}; 
    const dailyLimitCollection = "daily_limits";

    // Yönetici Modu Değişkenleri
    const ADMIN_CLICK_THRESHOLD = 20; 
    let clickCounter = 0;
    let isAdminMode = false; 

    // Global değişkenleri (Canvas tarafından sağlanan) güvenli bir şekilde al
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // Firebase Yapılandırması (Sizin projenizin bilgileri)
    let firebaseConfig = {
        apiKey: "AIzaSyDSkCSGQTWjRz0kdHj7rz398XkgWyy9Dcw",
        authDomain: "zeronn-20bd9.firebaseapp.com",
        projectId: "zeronn-20bd9",
        storageBucket: "zeronn-20bd9.firebasestorage.app",
        messagingSenderId: "252164380574",
        appId: "1:252164380574:web:aede06bbb71569295ee88f",
        measurementId: "G-KKJ4NR8W2P" 
    };
    
    // Geçerli bir config objesi olup olmadığını kontrol et
    const isValidConfig = Object.keys(firebaseConfig).length > 0 && firebaseConfig.projectId;

    // Firestore Genel Yolu (Ortak Veri)
    const slotCollectionPath = `/artifacts/${appId}/public/data/slots`;
    
    // UI Elementleri
    const slotGrid = document.getElementById('slot-grid');
    const loadingIndicator = document.getElementById('loading');
    const statusMessage = document.getElementById('status-message');
    const slotModal = document.getElementById('slot-modal');
    const modalContent = slotModal.querySelector('.modal-content');
    const adminStatusEl = document.getElementById('admin-status'); 


    // --- YARDIMCI FONKSİYONLAR ---

    function showStatus(message, type = 'error') {
        // Sadece hata olduğunda göster
        if (type !== 'error') return;

        statusMessage.textContent = message;
        statusMessage.classList.remove('hidden');
        // Kırmızı tema hataları için
        statusMessage.classList.add('bg-red-900', 'border-red-700', 'text-red-200');
        console.error("UYGULAMA HATASI:", message);
    }

    // Modal açma/kapama animasyonları
    window.openModal = function(slotId) {
        if (!isAuthReady || !userId) {
            showStatus("Hata: Kullanıcı oturumu henüz başlatılmadı. Lütfen bir saniye bekleyin ve tekrar deneyin.", 'error');
            return;
        }

        document.getElementById('selected-slot-id').value = slotId;
        document.getElementById('modal-title').textContent = `SLOT ${slotId} ALINIYOR`;
        
        // Modal formu ve sonuç alanını temizle/sıfırla
        document.getElementById('modal-form').classList.remove('hidden');
        document.getElementById('modal-result').classList.add('hidden');
        document.getElementById('team-name').value = '';
        document.getElementById('instagram-handle').value = '';

        slotModal.classList.remove('hidden');
        setTimeout(() => {
            slotModal.classList.add('opacity-100');
            modalContent.classList.remove('scale-95', 'opacity-0');
            modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
    }

    window.closeModal = function() {
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        slotModal.classList.remove('opacity-100');
        setTimeout(() => {
            slotModal.classList.add('hidden');
        }, 300); 
    }

    function showModalResult(message, isSuccess = true) {
        const resultText = document.getElementById('modal-result-text');
        resultText.textContent = message;
        resultText.classList.toggle('text-white', isSuccess);
        resultText.classList.toggle('text-red-400', !isSuccess);
        document.getElementById('modal-form').classList.add('hidden');
        document.getElementById('modal-result').classList.remove('hidden');
    }

    // --- YÖNETİCİ MODU AKTİVASYON LOGİĞİ ---
    function handleAdminClick() {
        if (!isAdminMode) {
            clickCounter++;
            if (clickCounter >= ADMIN_CLICK_THRESHOLD) {
                isAdminMode = true;
                
                console.warn("YÖNETİCİ MODU AKTİF EDİLDİ! Sayfayı yenilemeden slotları iptal edebilirsiniz. Sayfa yenilendiğinde mod sıfırlanır.");
                
                // Admin Status Banner'ı göster
                adminStatusEl.textContent = `YÖNETİCİ MODU AKTİF! (${clickCounter} Tıklama). Rezerve slotları İPTAL edebilirsiniz. (Bu modu kapatmak için buraya tıklayın)`;
                adminStatusEl.classList.remove('hidden', 'bg-red-900', 'border-red-700', 'text-red-200');
                adminStatusEl.classList.add('bg-green-900', 'border-green-700', 'text-green-200');
                
                // Admin modu kapatma işlevi (oturum içinde sıfırlama)
                adminStatusEl.onclick = () => {
                    isAdminMode = false;
                    clickCounter = 0;
                    adminStatusEl.classList.add('hidden');
                    adminStatusEl.onclick = null;
                    renderSlots(); // Slotları normal görünüme döndür
                    console.warn("YÖNETİCİ MODU KAPATILDI. 20 Tıklama ile tekrar açılabilir.");
                };
                
                renderSlots(); 
            }
        }
    }

    // Ekranın herhangi bir yerine tıklama olayını dinle
    document.body.addEventListener('click', handleAdminClick);

    // --- FIREBASE İŞLEMLERİ ---

    async function initializeFirebase() {
        if (!isValidConfig) {
            showStatus("KRİTİK HATA: Firebase yapılandırması eksik. Lütfen yapılandırma objesini kontrol edin.", 'error');
            loadingIndicator.style.display = 'none';
            return;
        }

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            // Kullanıcı oturumu durumunu dinle
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    // Kullanıcı zaten giriş yapmışsa (anonim veya başka yolla)
                    userId = user.uid;
                } else {
                    // Kullanıcı giriş yapmamışsa, anonim girişi zorla
                    try {
                        await signInAnonymously(auth);
                        userId = auth.currentUser.uid; // Giriş sonrası UID'yi al
                    } catch (error) {
                        console.error("Anonim giriş hatası:", error);
                        showStatus("KRİTİK HATA: Kullanıcı oturumu başlatılamadı. Firebase Authentication ayarlarını (Anonim Giriş) kontrol edin.", 'error');
                    }
                }
                
                // Auth hazır olduğunda gerçek zamanlı dinlemeyi başlat
                isAuthReady = true;
                startRealtimeListeners();
            });

        } catch (error) {
            console.error("Firebase başlatma hatası:", error);
            showStatus("KRİTİK HATA: Firebase SDK başlatılamadı. Konsol hatalarını inceleyin.", 'error');
        }
    }

    function startRealtimeListeners() {
        if (!db || !isAuthReady) return;

        // Slotların gerçek zamanlı dinlenmesi
        const q = collection(db, slotCollectionPath);
        
        onSnapshot(q, (snapshot) => {
            // BAŞARI: Veri alındı.
            RESERVED_SLOTS = {}; // Slotları sıfırla
            snapshot.forEach((doc) => {
                const data = doc.data();
                const slotId = parseInt(doc.id, 10); 
                RESERVED_SLOTS[slotId] = { 
                    teamName: data.teamName, 
                    handle: data.instagramHandle,
                    userId: data.userId,
                    timestamp: data.timestamp ? data.timestamp.toDate() : null
                };
            });
            renderSlots();
            loadingIndicator.style.display = 'none'; // Slotlar yüklendi, kapat
        }, (error) => { 
            // HATA: Dinleme başarısız oldu (Genellikle kural hatası)
            console.error("Slot dinleme hatası:", error);
            showStatus("HATA: Slotlar yüklenemedi. Sunucu Kurallarınızı (Firestore -> Rules) kontrol edin.", 'error');
            loadingIndicator.style.display = 'none'; // Hata durumunda da kapat
        });

        // Geri sayımı başlat
        startCountdown();
    }

    // *** SLOTLARI SIFIRLAMA İŞLEMİ (GECE 00:00) ***
    async function resetAllSlots() {
        if (!db) return;

        console.warn("[RESET] Gece Yarısı Otomatik Sıfırlama Başlatılıyor...");
        
        // Slot koleksiyonundaki tüm belgeleri al
        const q = query(collection(db, slotCollectionPath));
        
        try {
            const querySnapshot = await getDocs(q); 

            // Her belgeyi döngüye al ve sil (Rezervasyonları silmek yeterlidir.)
            // GÜNLÜK LİMİTLERİ SİLMEK GEREKMEZ, ÇÜNKÜ LİMİT KONTROLÜ ZATEN TARİH KONTROLÜ YAPIYOR.
            const deletePromises = [];
            querySnapshot.forEach((document) => {
                deletePromises.push(deleteDoc(doc(db, slotCollectionPath, document.id)));
            });

            await Promise.all(deletePromises);
            console.log(`[RESET] ${deletePromises.length} slot başarıyla sıfırlandı. Tüm slotlar tekrar kullanılabilir.`);
            
        } catch (error) {
            console.error("KRİTİK HATA: Slotları sıfırlama işlemi başarısız oldu:", error);
            showStatus("KRİTİK HATA: Gece sıfırlama işlemi başarısız oldu. Yönetici (Admin) yetkisiyle toplu silme izniniz (Firestore Kuralları) yoksa bu işlem çalışmaz.", 'error');
        }
    }


    // *** GÜNLÜK SLOT LİMİTİ KONTROLÜ ***
    async function checkDailyLimit(currentUserId) {
        if (!db) return false;

        // Kullanıcının günlük limit dokümanı yolu: /artifacts/{appId}/users/{userId}/daily_limits/limit
        const userLimitDocRef = doc(db, `/artifacts/${appId}/users/${currentUserId}/${dailyLimitCollection}`, 'limit');
        
        try {
            const docSnapshot = await getDoc(userLimitDocRef);

            if (docSnapshot.exists()) {
                const data = docSnapshot.data();
                
                // Firestore timestamp objesini Date objesine çevir
                const lastReservedDate = data.timestamp.toDate(); 
                
                // Bugünün başlangıcı (saat 00:00)
                const today = new Date();
                today.setHours(0, 0, 0, 0); 

                // Rezervasyon yapılan günün başlangıcı (saat 00:00)
                const lastReservationDay = new Date(lastReservedDate);
                lastReservationDay.setHours(0, 0, 0, 0);

                // Eğer son rezervasyon günü (00:00'a yuvarlanmış) ile bugünün başlangıcı aynıysa limit dolmuştur.
                if (lastReservationDay.getTime() === today.getTime()) {
                    return true; // Limit doldu, bugün slot almış.
                }
            }
            return false; // Limit dolmadı veya eski bir tarihte alınmış.

        } catch (error) {
            console.error("Günlük limit kontrol hatası:", error);
            return false;
        }
    }

    // *** YÖNETİCİ MODU: SLOT SİLME İŞLEMİ (LİMİT SIFIRLAMA EKLENDİ) ***
    window.deleteSlot = async function(slotId) {
        if (!isAdminMode || !db) return;

        const slotInfo = RESERVED_SLOTS[slotId];
        if (!slotInfo || !slotInfo.userId) {
            console.error(`[ADMIN] SLOT ${slotId} bilgisi bulunamadı veya userId eksik.`);
            showStatus(`Hata: Slot ${slotId} silinirken kullanıcı bilgisi eksik.`, 'error');
            return;
        }
        
        const targetUserId = slotInfo.userId;

        try {
            // 1. Slot rezervasyon belgesini sil
            const slotRef = doc(db, slotCollectionPath, String(slotId));
            await deleteDoc(slotRef);

            // 2. Kullanıcının günlük limit belgesini sil (Böylece kullanıcı tekrar rezervasyon yapabilir)
            const userLimitDocRef = doc(db, `/artifacts/${appId}/users/${targetUserId}/${dailyLimitCollection}`, 'limit');
            await deleteDoc(userLimitDocRef); // BU ADIM KULLANICININ LİMİTİNİ SIFIRLAR

            console.log(`[ADMIN] SLOT ${slotId} başarıyla silindi/iptal edildi. Kullanıcı ${targetUserId} için günlük limit sıfırlandı.`);
            // onSnapshot otomatik güncelleyecektir.

        } catch (error) {
            console.error("Yönetici silme hatası:", error);
            showStatus(`Hata: Slot ${slotId} silinirken bir hata oluştu. Yönetici silme yetkinizi (Firestore Kuralları) kontrol edin.`, 'error');
        }
    }

    window.reserveSlot = async function() {
        const modalButton = document.getElementById('reserve-button');

        const slotId = document.getElementById('selected-slot-id').value;
        const teamName = document.getElementById('team-name').value.trim();
        const instagramHandle = document.getElementById('instagram-handle').value.trim();
        
        if (!teamName || !instagramHandle) {
            showModalResult("Hata: Takım adı ve Instagram hesabı boş bırakılamaz.", false);
            return;
        }

        if (!userId) {
            showModalResult("Hata: Kullanıcı oturumu aktif değil. Lütfen sayfayı yenileyin ve bekleyin.", false);
            return;
        }

        if (RESERVED_SLOTS[slotId]) {
             showModalResult("Hata: Bu slot az önce başkası tarafından alındı. Lütfen başka bir slot seçin.", false);
            return;
        }

        // Butonu devre dışı bırak
        modalButton.disabled = true;
        modalButton.textContent = "Kaydediliyor...";

        try {
            // 1. GÜNLÜK LİMİT KONTROLÜ
            const limitExceeded = await checkDailyLimit(userId);
            if (limitExceeded) {
                showModalResult("Hata: Günlük slot limitiniz dolmuştur. Her takım günde sadece 1 slot alabilir.", false);
                return;
            }

            // 2. Slotu Kaydet (Herkese Açık Veri)
            const slotRef = doc(db, slotCollectionPath, slotId);
            const slotData = {
                slotId: parseInt(slotId, 10),
                teamName: teamName,
                instagramHandle: instagramHandle,
                userId: userId,
                timestamp: Timestamp.now()
            };
            
            await setDoc(slotRef, slotData, { merge: false });

            // 3. GÜNLÜK LİMİT KAYDINI OLUŞTUR (Kullanıcının Özel Verisi)
            const userLimitDocRef = doc(db, `/artifacts/${appId}/users/${userId}/${dailyLimitCollection}`, 'limit');
            await setDoc(userLimitDocRef, { 
                timestamp: Timestamp.now(),
                slotId: parseInt(slotId, 10)
            });

            showModalResult(`Başarılı! SLOT ${slotId} başarıyla "${teamName}" için rezerve edildi.`, true);

        } catch (error) {
            console.error("Slot kayıt hatası:", error);
            
            let errorMessage = "Hata: Kayıt sırasında beklenmedik bir hata oluştu. Lütfen konsol hatalarını kontrol edin.";
            if (error.code === 'permission-denied') {
                errorMessage = "Hata: Sunucu Kuralı İhlali! Slotun başkası tarafından alınmış olması veya Firestore kurallarınızın eksik olması muhtemel. Güvenlik kurallarınızı kontrol edin.";
            }

            showModalResult(errorMessage, false);
        } finally {
            // Butonu tekrar etkinleştir ve metnini geri yükle
            modalButton.disabled = false;
            modalButton.textContent = "SLOTU REZERVE ET";
        }
    }

    // --- ARAYÜZ İŞLEMLERİ ---

    function renderSlots() {
        slotGrid.innerHTML = ''; // Temizle
        
        // Admin modu açıksa, banner'ı güncelle (kapatılmadıysa)
        if(isAdminMode && adminStatusEl.classList.contains('hidden')) {
             adminStatusEl.textContent = `YÖNETİCİ MODU AKTİF! (${clickCounter} Tıklama). Rezerve slotları İPTAL edebilirsiniz. (Bu modu kapatmak için buraya tıklayın)`;
             adminStatusEl.classList.remove('hidden', 'bg-red-900', 'border-red-700', 'text-red-200');
             adminStatusEl.classList.add('bg-green-900', 'border-green-700', 'text-green-200');
        } else if (!isAdminMode) {
             adminStatusEl.classList.add('hidden');
             adminStatusEl.onclick = null;
        }

        for (let i = 1; i <= TOTAL_SLOTS; i++) {
            const slotId = String(i);
            const slotInfo = RESERVED_SLOTS[i];
            const isReserved = !!slotInfo;

            const card = document.createElement('div');
            card.id = `slot-${slotId}`;
            
            // Temaya uygun class'lar
            card.className = `slot-card p-4 rounded-xl shadow-lg flex flex-col items-center justify-center h-28 ${isReserved && !isAdminMode ? 'reserved' : 'bg-gray-800'}`;
            
            const slotTitle = document.createElement('span');
            slotTitle.className = 'text-2xl font-extrabold tracking-wide';
            slotTitle.textContent = `SLOT ${slotId}`;
            
            const statusText = document.createElement('p');
            statusText.className = 'text-xs mt-1 font-medium opacity-80';

            if (isReserved) {
                // Rezerve edilmiş slot bilgileri
                statusText.innerHTML = `ALINDI: <span class="font-bold">${slotInfo.teamName}</span>`;
                card.title = `Takım: ${slotInfo.teamName}\nIG: ${slotInfo.handle}`;
                
                // YÖNETİCİ MODU EKLENTİSİ
                if (isAdminMode) {
                    const adminDiv = document.createElement('div');
                    adminDiv.className = 'mt-2';
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'text-xs px-2 py-1 bg-red-700 hover:bg-red-800 rounded transition duration-150 font-bold text-white';
                    deleteButton.textContent = 'İPTAL ET (YÖN.)';
                    deleteButton.onclick = (e) => {
                        e.stopPropagation(); // Kart tıklamasını engelle
                        deleteSlot(slotId);
                    };
                    adminDiv.appendChild(deleteButton);
                    card.appendChild(adminDiv);

                    // Yönetici modunda rezerve slot stili
                    card.classList.remove('reserved'); 
                    card.classList.add('bg-red-900/50', 'border-red-600', 'cursor-default');
                    card.onclick = null; // Yönetici modunda rezerve slot tıklaması devre dışı
                } else {
                    // Normal kullanıcı rezerve slot stili ve davranışı
                    card.classList.add('reserved');
                    card.onclick = null;
                }

            } else {
                // Boş slot
                statusText.textContent = 'TIKLAYARAK AL';
                card.onclick = () => openModal(slotId);
                card.classList.add('hover:bg-red-700/80');
            }

            card.appendChild(slotTitle);
            card.appendChild(statusText);
            slotGrid.appendChild(card);
        }
    }

    // Geri sayım
    function startCountdown() {
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now);
            
            // Türkiye saati ile gece 00:00
            tomorrow.setDate(now.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0); 

            let diffMs = tomorrow - now;
            
            // Eğer diffMs negatifse (yani 00:00'ı geçtiyse), yarını hedefle
            if (diffMs < 0) {
                 tomorrow.setDate(now.getDate() + 2); // Bir sonraki günü hedefle
                 tomorrow.setHours(0, 0, 0, 0);
                 diffMs = tomorrow - now; // Yeni farkı hesapla
            }

            // Eğer süre 1 saniyeden azsa (yani tam sıfırlanma anı)
            if (diffMs < 1000 && diffMs >= 0) {
                 resetAllSlots(); // Slotları sıfırlama işlemini çağır
            }

            const hours = Math.floor(diffMs / (1000 * 60 * 60));
            const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);

            const format = (n) => String(n).padStart(2, '0');
            countdownEl.textContent = `${format(hours)}:${format(minutes)}:${format(seconds)}`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    }

    // Uygulamayı Başlat
    initializeFirebase();
</script>
